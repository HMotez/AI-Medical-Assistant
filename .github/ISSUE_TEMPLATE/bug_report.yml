name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click on …
        3. See the error
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser / OS
      placeholder: Chrome 140 on Windows 11
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Drag images here. Never include passwords, keys or personal data.
