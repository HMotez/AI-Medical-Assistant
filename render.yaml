# Render Blueprint — creates the API and the website in one step.
# Render dashboard → New → Blueprint → pick this repository. See DEPLOY.md.
#
# The database is a free PostgreSQL on Neon (Render's free database is deleted
# after 30 days): paste its connection string into DATABASE_URL when asked.

services:
  # ── API (FastAPI + ML model), Docker ─────────────────────────────────────────
  - type: web
    name: medai-api-hmotez            # → https://medai-api-hmotez.onrender.com
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:                      # rebuild only when the API's own files change
      paths:
        - backend/**
        - ml/**
        - docker/Dockerfile.backend
        - docker/entrypoint.sh
        - frontend/src/i18n/medical-labels.json   # copied into the image for PDF reports
      ignoredPaths:
        - "**/*.md"
        - backend/tests/**
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true             # random secret, generated by Render
      - key: DATABASE_URL
        sync: false                     # Neon connection string (asked at creation)
      - key: ALLOWED_ORIGINS
        value: '["https://medai-hmotez.onrender.com"]'
      - key: ADMIN_EMAIL
        sync: false                     # your administrator login
      - key: ADMIN_PASSWORD
        sync: false                     # 12+ characters, keep it private
      - key: DEMO_ACCOUNTS
        value: "true"                   # demo patient for visitors (patient@medai.com)
      - key: ANTHROPIC_API_KEY
        sync: false                     # optional: leave empty for the offline assistant

  # ── Website (React build), static ────────────────────────────────────────────
  - type: web
    name: medai-hmotez                # → https://medai-hmotez.onrender.com
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    autoDeploy: true
    envVars:
      - key: REACT_APP_API_URL
        value: https://medai-api-hmotez.onrender.com
      - key: CI
        value: "false"                  # a lint warning must not fail the build
    routes:
      - type: rewrite                   # single-page app: every path serves index.html
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
